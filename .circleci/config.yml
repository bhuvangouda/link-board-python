version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install ruff
          command: pip install ruff
      - run:
          name: Lint with ruff
          command: ruff check app/ tests/

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
      - run:
          name: Run unit tests with coverage
          command: pytest tests/unit/ --cov=app --cov-report=term-missing --junitxml=test-results/unit.xml
      - store_test_results:
          path: test-results

  integration-tests:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: "postgresql://linkboard:linkboard@localhost:5432/linkboard"
          REDIS_URL: "redis://localhost:6379/0"
      - image: cimg/postgres:16.3
        environment:
          POSTGRES_USER: linkboard
          POSTGRES_PASSWORD: linkboard
          POSTGRES_DB: linkboard
      - image: cimg/redis:7.2
    steps:
      - checkout
      - run:
          name: Wait for PostgreSQL
          command: |
            command -v pg_isready >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)
            for i in $(seq 1 30); do
              pg_isready -h localhost -U linkboard -d linkboard && break
              echo "Waiting for postgres... ($i)"
              sleep 2
            done
      - run:
          name: Apply migrations
          command: |
            for f in migrations/*.sql; do
              echo "Applying $f ..."
              PGPASSWORD=linkboard psql -h localhost -U linkboard -d linkboard -v ON_ERROR_STOP=1 -f "$f"
            done
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
            pip install -r requirements-dev.txt
      - run:
          name: Run integration tests
          command: pytest tests/integration/ -v --junitxml=test-results/integration.xml
      - store_test_results:
          path: test-results

  secret-scan:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            GITLEAKS_VERSION=8.18.4
            wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            chmod +x gitleaks
      - run:
          name: Run gitleaks
          command: ./gitleaks detect --source=. --no-git -v

  docker-build:
    docker:
      - image: cimg/base:current
    parameters:
      env_tag:
        type: string
        default: "qa"
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Build and push Docker image with tags
          command: |
            SHORT_SHA=$(echo "${CIRCLE_SHA1}" | cut -c1-7)
            IMMUTABLE_TAG="${CIRCLE_BRANCH}-${SHORT_SHA}"
            ENV_TAG="<< parameters.env_tag >>"

            IMAGE_NAME="${DOCKERHUB_USER}/link-board"

            echo "Building image ${IMAGE_NAME}:${ENV_TAG} and ${IMAGE_NAME}:${IMMUTABLE_TAG}..."
            docker build \
              -t "${IMAGE_NAME}:${ENV_TAG}" \
              -t "${IMAGE_NAME}:${IMMUTABLE_TAG}" .

            if [ -z "$DOCKERHUB_USER" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "ERROR: DOCKERHUB_USER and DOCKERHUB_TOKEN must be set to push Docker images." >&2
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker push "${IMAGE_NAME}:${ENV_TAG}"
            docker push "${IMAGE_NAME}:${IMMUTABLE_TAG}"

workflows:
  main-pipeline:
    jobs:
      - secret-scan:
          filters:
            branches:
              only: main
      - lint:
          requires:
            - secret-scan
          filters:
            branches:
              only: main
      - unit-tests:
          requires:
            - lint
          filters:
            branches:
              only: main
      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - docker-build:
          name: docker-build-qa
          env_tag: "qa"
          requires:
            - integration-tests
          filters:
            branches:
              only: main

  staging-pipeline:
    jobs:
      - docker-build:
          name: docker-build-stage
          env_tag: "stage"
          filters:
            branches:
              only: staging

  prod-pipeline:
    jobs:
      - docker-build:
          name: docker-build-prod
          env_tag: "prod"
          filters:
            branches:
              only: prod
